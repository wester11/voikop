name: Catalog validation

on:
  pull_request:
    paths:
      - "lists/**"
      - ".github/workflows/catalog-validation.yml"
  push:
    branches: [main]
    paths:
      - "lists/**"
      - ".github/workflows/catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run catalog generator tests
        run: python -m unittest discover -s lists/catalog -p 'test_*.py' -v
      - name: Verify catalog integrity
        run: python lists/catalog/validate_catalog.py
      - name: Verify generated game profile
        run: python lists/catalog/generate_games_all.py --check
